# MediaMTX receiver — accepts the Pi's RTSP push on `usbcam` and re-serves it
# to the perception pipeline at rtsp://<host>:8554/usbcam. Live only.
#
# NOTE: MediaMTX does NOT expand ${VAR} inside this file (only in runOn* hooks).
# Secrets arrive via MTX_ environment overrides (see cloud/docker-compose.yml):
# entry 0 below is the static anonymous reader; the Pi publisher is injected
# as entry 1 (MTX_AUTHINTERNALUSERS_1_USER/PASS/PERMISSIONS_*).
logLevel: info
rtspAddress: :8554
rtspTransports: [tcp]

authInternalUsers:
  - user: any
    permissions:
      - action: read

paths:
  usbcam:
    record: false
