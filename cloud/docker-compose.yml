name: thinclient-cloud

# Single container. Receives the Pi's RTSP push and serves it locally as
# rtsp://media:8554/usbcam — the exact format the perception pipeline ingests.
# Nothing is recorded.
services:
  receiver:
    image: bluenviron/mediamtx:1.21.1
    container_name: thinclient-receiver
    restart: unless-stopped
    ports:
      - "${RTSP_PORT:-8554}:8554"   # RTSP (Pi push in, perception read out)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    env_file:
      - path: ../cloud/.env
        required: false
    environment:
      MTX_RTSPADDRESS: ":8554"
      # Pi publisher = auth entry 1 (entry 0 is the static anon reader in yml).
      MTX_AUTHINTERNALUSERS_1_USER: ${RTSP_PUBLISH_USER:-pi}
      MTX_AUTHINTERNALUSERS_1_PASS: ${RTSP_PUBLISH_PASS:-changeme}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: usbcam
      TZ: Asia/Kolkata
